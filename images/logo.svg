<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="paper-craft-skills logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- paper sheet -->
  <g transform="rotate(-6 124 128)" filter="url(#shadow)">
    <path d="M76 44 H152 L184 76 V196 a12 12 0 0 1 -12 12 H76 a12 12 0 0 1 -12 -12 V56 a12 12 0 0 1 12 -12 Z" fill="#FFFFFF"/>
    <path d="M152 44 V68 a8 8 0 0 0 8 8 H184 Z" fill="#C7D2FE"/>

    <!-- title + text lines -->
    <line x1="82" y1="72" x2="134" y2="72" stroke="#4338CA" stroke-width="9" stroke-linecap="round"/>
    <line x1="82" y1="94" x2="166" y2="94" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    <line x1="82" y1="110" x2="150" y2="110" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>

    <!-- method figure: small node graph -->
    <g stroke="#A5B4FC" stroke-width="4" stroke-linecap="round">
      <line x1="94" y1="162" x2="126" y2="140"/>
      <line x1="94" y1="162" x2="126" y2="184"/>
      <line x1="126" y1="140" x2="158" y2="162"/>
      <line x1="126" y1="184" x2="158" y2="162"/>
    </g>
    <circle cx="94" cy="162" r="10" fill="#4338CA"/>
    <circle cx="126" cy="140" r="9" fill="#7C3AED"/>
    <circle cx="126" cy="184" r="9" fill="#7C3AED"/>
    <rect x="148" y="152" width="20" height="20" rx="5" fill="#F59E0B"/>
  </g>

  <!-- craft sparkles -->
  <path d="M196 150 Q196 178 224 178 Q196 178 196 206 Q196 178 168 178 Q196 178 196 150 Z" fill="url(#spark)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M212 34 Q212 48 226 48 Q212 48 212 62 Q212 48 198 48 Q212 48 212 34 Z" fill="#FDE68A"/>
</svg>
